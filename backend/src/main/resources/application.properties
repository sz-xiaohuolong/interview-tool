server.address=127.0.0.1
server.port=${PORT:8080}
spring.application.name=interview-coach
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never
server.error.include-stacktrace=never
app.data-dir=${DATA_DIR:./data}
app.demo=${DEMO_MODE:false}
app.web.frontend-port=${WEB_PORT:5173}
app.llm.provider=${LLM_PROVIDER:openai}
app.llm.base-url=${LLM_BASE_URL:https://api.openai.com/v1}
app.llm.api-key=${LLM_API_KEY:}
app.llm.model=${LLM_MODEL:gpt-4o-mini}
app.llm.timeout-seconds=${LLM_TIMEOUT_SECONDS:60}
app.llm.reasoning-effort=${LLM_REASONING_EFFORT:}
# 综合面试与共用接口由同一应用默认提供，无需单独的版本 Profile。
app.interview.followup-deadline-ms=${INTERVIEW_FOLLOWUP_DEADLINE_MS:${app.v3.fast-deadline-ms:31000}}

# 源码能力可关闭；已关联场次会提示显式选择资料面试。
app.source.enabled=${SOURCE_ENABLED:true}
